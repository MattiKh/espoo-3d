# Netlify julkaisee public/-kansion sellaisenaan. Aineistot ja tiilet on tehty valmiiksi
# (scripts/build_data.py), joten erillistä build-vaihetta ei ole.
[build]
  publish = "public"
  command = ""

# HSY:n WMS ei salli selaimen suoria hakuja (CORS), joten Netlify välittää ne.
# Vastaa paikallisen server.py:n reittiä /proxy/hsy/wms; kyselyparametrit siirtyvät mukana.
[[redirects]]
  from = "/proxy/hsy/wms"
  to = "https://kartta.hsy.fi/geoserver/wms"
  status = 200
  force = true

# Lentokoneiden sijainnit (adsb.fi) eivät myöskään salli selaimen suoria hakuja.
# Vastaa server.py:n reittiä /proxy/adsb/...
[[redirects]]
  from = "/proxy/adsb/*"
  to = "https://opendata.adsb.fi/api/v2/:splat"
  status = 200
  force = true

# Pelillisen maaston tiilet haetaan aina aineistoversion kanssa (?v=, build_data.py päivittää), joten
# selain voi pitää ne välimuistissa tarkistamatta. Liikkuessa samat tiilet tulevat näin heti.
[[headers]]
  for = "/tiles/maanpeite/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tiles/pelimaasto/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tiles/pelisillat/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
